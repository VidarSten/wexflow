# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'Wexflow.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
# 1. Install the .NET 10 SDK to the default system path so MSBuild finds it naturally
- task: UseDotNet@2
  displayName: 'Use .NET Core sdk'
  inputs:
    packageType: sdk
    version: 10.x

# 2. Use MSBuild to restore the hybrid solution packages
- task: VSBuild@1
  displayName: 'Restore NuGet Packages'
  inputs:
    solution: '$(solution)'
    msbuildArguments: '/t:Restore' # This runs MSBuild's native modern restore
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

# 3. Build the solution
- task: VSBuild@1
  displayName: 'Build Solution'
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
