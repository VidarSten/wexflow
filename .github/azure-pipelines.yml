# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'Wexflow.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
# 1. Install a stable .NET 10 SDK version that works with MSBuild 17
- task: UseDotNet@2
  displayName: 'Use .NET Core sdk'
  inputs:
    packageType: sdk
    version: '10.0.104' # Avoids the 10.0.20x MSBuild incompatibility bug

# 2. Use 64-bit MSBuild to restore packages so it can find the x64 SDK
- task: VSBuild@1
  displayName: 'Restore NuGet Packages'
  inputs:
    solution: '$(solution)'
    msbuildArguments: '/t:Restore'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArchitecture: 'x64' # Forces MSBuild to look in Program Files\dotnet

# 3. Build the solution using 64-bit MSBuild
- task: VSBuild@1
  displayName: 'Build Solution'
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArchitecture: 'x64' # Keeps the architecture uniform for the build phase
